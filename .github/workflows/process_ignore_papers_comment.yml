# Try to automatically update papers from INSPIRE

name: Process PR comment to ignore papers

on:
  issue_comment:
    types: [created]

jobs:
  process-PR-comment:

    # Only run on upstream, not on each fork
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/ignore-papers ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: refs/pull/${{ github.event.issue.number }}/head
        fetch-depth: 0
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run processIgnorePapers.py
      run: |
        cd _papers
        ARGS=$(echo "${{ github.event.comment.body }}" | sed -E 's|/ignore-papers[[:space:]]+||')
        python inspSXSUpdateByDate.py $ARGS
    - name: Commit and push changes
      run: |
        git commit -m "Ignoring papers request in PR comment" || echo "No changes to commit"
        git push origin HEAD:refs/pull/${{ github.event.issue.number }}/head
